projects:
  - id: "particle_track_reconstruction_spin_glass"
    title: "Particle Track Reconstruction as a Spin-Glass Optimization Problem"
    organization: "ETH Zurich, Computational Statistical Physics"
    start: "Spring 2026"
    end: "Spring 2026"
    status: "completed"
    objective: "Reconstruct LHC particle tracks by formulating the task as an Ising-like spin-glass optimization problem."
    contributions:
      - "Mapped particle-track reconstruction to an Ising-like spin-glass model with a physics-motivated Hamiltonian."
      - "Built a C++ simulated-annealing solver minimizing a three-term energy function for alignment, length, and curvature constraints."
      - "Tuned hyperparameters with Optuna on the Euler cluster."
    methods: ["Monte Carlo", "simulated annealing", "Ising-like spin-glass model", "hyperparameter optimization"]
    tools: ["C++", "Python", "Optuna", "Euler cluster"]
    results: ["85% strict track efficiency on clean events."]
    outputs: []
    tags: [particle_physics, optimization, monte_carlo, hpc, parallel_computing, scientific_computing, cplusplus, research]
    sources: ["cv_cern_math/main.tex", "cv_RL4F1/main.tex"]
    verified: false
  - id: "ai_sciences_engineering_scientific_ml"
    title: "AI in the Sciences and Engineering"
    alternate_titles: ["Deep Learning in Scientific Computing"]
    organization: "ETH Zurich"
    start: "Fall 2025"
    end: "Fall 2025"
    status: "completed"
    objective: "Study scientific-machine-learning methods for PDEs, dynamical systems, and irregular geometries."
    contributions:
      - "Compared Physics-Informed Neural Networks (PINNs) and data-driven MLPs on a multiscale Poisson equation."
      - "Used filter normalization and Hessian-eigenvector analysis to examine ill-conditioned PINN loss landscapes and high-frequency training instability."
      - "Trained a Fourier Neural Operator (FNO) as a neural surrogate for an unknown dynamical system."
      - "Implemented one-to-one and time-conditional all-to-all FNO training strategies."
      - "Evaluated FNO resolution invariance and fine-tuned it for transfer learning on out-of-distribution data."
      - "Extended the Geometry-Aware Operator Transformer (GAOT) with random-sampling tokenization and dynamic KNN-based radius aggregation for irregular geometries on the Elasticity benchmark."
    methods: ["Physics-Informed Neural Networks", "Fourier Neural Operators", "neural operators", "filter normalization", "Hessian eigenvector analysis", "transfer learning", "KNN-based radius aggregation"]
    tools: ["PyTorch"]
    results:
      - "Identified high-frequency components as inducing ill-conditioned PINN loss landscapes."
      - "Demonstrated transfer learning to out-of-distribution regimes for the learned neural operator."
    outputs: []
    tags: [machine_learning, deep_learning, scientific_computing, numerical_methods, pde, neural_operators, optimization, research]
    sources: ["cv/main.tex", "cv_cern_math/main.tex", "cv_deepmind_student_research/main.tex", "cv_IBM_research/main.tex", "cv_jane_street/main.tex", "cv_las_semestral_project/main.tex", "cv_optimized/main.tex", "cv_research_assistant/main.tex", "cv_RL4F1/main.tex"]
    verified: false
  - id: "generative_antibody_design"
    title: "Generative Antibody Design with Protein Language Models"
    alternate_titles: ["Generative Antibody Design via Preference Optimization"]
    organization: "ETH Zurich, Learning & Adaptive Systems Group"
    supervisors: ["Prof. Andreas Krause", "Scott Sussex"]
    collaborators: ["Reddy Lab"]
    start: "Spring 2026"
    end: ""
    status: "ongoing"
    objective: "Train a generative model to propose high-affinity antibody sequences instead of relying on random mutation and scoring."
    contributions:
      - "Implemented beam search over the CDRH3 region to use ESM2, a masked protein language model, as a generative model for antibody design."
      - "Fine-tuned ESM2 via evolutionary fine-tuning and Direct Preference Optimization (DPO / g-DPO) on experimental binding-affinity data."
      - "Built an end-to-end training and evaluation pipeline using Hydra configurations and Slurm cluster jobs."
      - "Compared vanilla, evotuned, and DPO-tuned models on pseudo-log-likelihood correlation, generation diversity, and predicted affinity."
      - "Evaluated generalization of generated candidates at 5, 8, and 11 mutations from wild type."
    methods: ["protein language models", "beam search", "evolutionary fine-tuning", "Direct Preference Optimization", "out-of-distribution evaluation"]
    tools: ["ESM2", "PyTorch", "Hydra", "Slurm"]
    results: ["The frozen base model's pseudo-log-likelihood had no correlation with binding affinity; fine-tuning restored the correlation."]
    outputs: []
    data: "Experimental binding data from a double deep mutational scan of the C05 broadly neutralising anti-influenza antibody."
    notes: "The antibody's CDRH3 loop is described as unusually long (24 residues)."
    tags: [computational_biology, machine_learning, deep_learning, protein_language_models, optimization, hpc, research]
    sources: ["cv_cern_math/main.tex", "cv_deepmind_student_research/main.tex", "cv_IBM_research/main.tex", "cv_optimized/main.tex", "cv_research_assistant/main.tex", "cv_RL4F1/main.tex"]
